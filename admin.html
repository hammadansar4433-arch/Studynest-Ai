<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>StudyNest · Visitors</title>
<style>
:root{--bg:#f4f6f1;--sf:#fff;--tx:#0f1f1a;--mu:#5f7068;--ac:#0f766e;--ln:#dde8e1;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#07110d;--sf:#0e1b16;--tx:#eef5f0;--mu:#93aaa0;--ac:#34d399;--ln:#1b3128}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
main{max-width:900px;margin:0 auto}h1{font:700 26px Georgia,serif;margin:0 0 12px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.n b{display:block;font:700 34px Georgia,serif;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
.ch{display:flex;gap:6px;align-items:flex-end;height:120px}.ch div{flex:1;text-align:center;font-size:10px;color:var(--mu)}.ch i{display:block;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}
.r{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--ln)}.r:first-of-type{border-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 8px;border-top:1px solid var(--ln);white-space:nowrap}.w{overflow-x:auto}
input,button{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--tx)}button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}
</style></head><body><main>
<h1>StudyNest visitors</h1>
<div id="login" class="card"><p class="mu">Enter the ADMIN_KEY you set in Vercel.</p><input id="k" type="password" placeholder="Admin key"> <button id="go">Show</button><p id="err" class="mu"></p></div>
<div id="out" hidden></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(k){$('#err').textContent='Loading…';try{const r=await fetch('/api/stats?key='+encodeURIComponent(k)),j=await r.json();if(!r.ok){$('#err').textContent=j.error||'Error';sessionStorage.removeItem('adk');return}
sessionStorage.setItem('adk',k);$('#login').hidden=true;const o=$('#out');o.hidden=false;const mx=Math.max(1,...j.days.map(d=>d.n));
const list=a=>a.map(x=>`<div class="r"><span>${esc(x.k)}</span><b>${x.n}</b></div>`).join('')||'<p class="mu">No data yet</p>';
o.innerHTML=`<div class="g"><div class="card n"><b>${j.users.total}</b>sign-ups (${j.users.week} this week)</div><div class="card n"><b>${j.today}</b>visits today</div><div class="card n"><b>${j.week}</b>last 7 days</div><div class="card n"><b>${j.people}</b>different people</div><div class="card n"><b>${j.visits}</b>total visits</div></div>
<div class="card"><h3>Last 14 days</h3><div class="ch">${j.days.map(d=>`<div><i style="height:${d.n/mx*100}%"></i>${d.n}<br>${esc(d.d)}</div>`).join('')||'<span class="mu">No visits yet</span>'}</div></div>
<div class="g2"><div class="card"><h3>Countries</h3>${list(j.countries)}</div><div class="card"><h3>Devices</h3>${list(j.devices)}</div><div class="card"><h3>Classes</h3>${list(j.classes)}</div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h3>Latest sign-ups</h3><button id="csv">Download all emails (CSV)</button></div><div class="w"><table><tr><th>When</th><th>Email</th><th>Name</th></tr>${j.signups.map(v=>`<tr><td>${esc(v.t)}</td><td>${esc(v.email)}</td><td>${esc(v.name)}</td></tr>`).join("")||"<tr><td class=mu>No sign-ups yet</td></tr>"}</table></div></div>
<div class="card"><h3>Latest visits</h3><div class="w"><table><tr><th>When</th><th></th><th>Where</th><th>Device</th><th>Class</th><th>From</th></tr>${j.recent.map(v=>`<tr><td>${esc(v.t)}</td><td>${v.is_new?'🆕':'🔁'}</td><td>${esc([v.city,v.country].filter(Boolean).join(', '))}</td><td>${esc(v.device)} · ${esc(v.browser)}</td><td>${esc(v.cls)}</td><td>${esc(v.ref)||'direct'}</td></tr>`).join('')}</table></div></div>`;$('#csv').onclick=async()=>{const t=await (await fetch('/api/stats?csv=1&key='+encodeURIComponent(k))).text(),l=document.createElement('a');l.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));l.download='signups.csv';l.click()}}catch(e){$('#err').textContent='Could not load'}}
$('#go').onclick=()=>load($('#k').value);$('#k').onkeydown=e=>{if(e.key=='Enter')load($('#k').value)};const s=sessionStorage.getItem('adk');if(s)load(s);
</script></body></html>
